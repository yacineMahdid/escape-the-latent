<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mini-game harness</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/game.css">
<style>body{background:linear-gradient(#bfe6ff,#8fd47a)} #log{position:fixed;left:8px;bottom:8px;z-index:100;background:#2b2233;color:#fffdf6;padding:6px 10px;border-radius:8px;font:13px monospace}</style>
</head><body>
<div id="game"></div><div id="ui-root"></div><div id="log">loading…</div>
<script type="module">
// /dev/minigame.html?region=attention&challenge=m1   mounts that challenge's mini-game with its spec
// /dev/minigame.html?module=_demo-catch              mounts a module with an empty spec
// window.__minigame = { won, closed, events, ready, host } for automated tests (host.__mg drives the kit).
import { openModal } from '/js/ui/modal.js';
import { sfx } from '/js/game/sfx.js';
const q = new URLSearchParams(location.search);
const log = (m) => { document.getElementById('log').textContent = m; };
window.__minigame = { won: false, closed: false, events: [] };
let name = q.get('module'); let spec = {};
if (!name) {
  const region = await (await fetch(`/content/regions/${q.get('region') || 'attention'}.json`)).json();
  const extra = await fetch(`/content/extra/${q.get('region') || 'attention'}.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  const all = [...(region.challenges || []), ...((extra && extra.challenges) || [])];
  const ch = all.find((c) => c.id === (q.get('challenge') || 'm1'));
  if (!ch || ch.type !== 'minigame') { log('no such mini-game challenge'); throw new Error('no minigame'); }
  name = ch.minigame; spec = { title: ch.title, ...(ch.spec || {}) };
}
const mod = await import(`/js/minigames/${name}.js`);
const host = document.createElement('div'); host.className = 'puzzle-host';
document.getElementById('ui-root').appendChild(host);
openModal(host, { onEscape: () => { window.__minigame.closed = true; log('closed (Esc)'); } });
(mod.default || mod).mount(host, spec, {
  onWin: () => { window.__minigame.won = true; window.__minigame.events.push('win'); log('WON ✓'); },
  onClose: () => { window.__minigame.closed = true; window.__minigame.events.push('closed'); log('closed'); },
  sfx: (n) => { window.__minigame.events.push('sfx:' + n); sfx(n); },
});
window.__minigame.host = host;
window.__minigame.ready = true;
log(`minigame: ${name}`);
</script></body></html>
